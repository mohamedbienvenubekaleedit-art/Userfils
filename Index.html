<!DOCTYPE html>

<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mon WhatsApp Bot</title>

  <style>

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }

    body {

      font-family: Arial, sans-serif;

      background: #0f172a;

      color: white;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }

    .container {

      background: #1e293b;

      width: 100%;

      max-width: 400px;

      padding: 30px;

      border-radius: 18px;

      text-align: center;

      box-shadow: 0 10px 30px #0005;

    }

    .logo {

      font-size: 55px;

      margin-bottom: 15px;

    }

    h1 {

      font-size: 27px;

      margin-bottom: 12px;

    }

    p {

      color: #cbd5e1;

      line-height: 1.6;

      margin-bottom: 20px;

    }

    .status {

      display: inline-block;

      background: #064e3b;

      color: #6ee7b7;

      padding: 10px 16px;

      border-radius: 20px;

      font-size: 14px;

      margin-bottom: 25px;

    }

    button {

      width: 100%;

      padding: 14px;

      background: #16a34a;

      color: white;

      border: none;

      border-radius: 10px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }

    button:hover {

      background: #15803d;

    }

    footer {

      margin-top: 25px;

      font-size: 12px;

      color: #94a3b8;

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="logo">🤖</div>

    <h1>Mon WhatsApp Bot</h1>

    <p>

      Bienvenue sur ton tableau de bord.

      Ton propre bot WhatsApp est en préparation.

    </p>

    <div class="status">

      ● Bot en préparation

    </div>

    <button onclick="alert('Le bot sera bientôt disponible !')">

      Mon bot

    </button>

    <footer>

      © 2026 Mon WhatsApp Bot

    </footer>

  </div>

</body>

</html>
